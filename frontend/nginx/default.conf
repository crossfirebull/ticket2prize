server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # In AWS the load balancer sends /api to the API service. Locally,
    # docker-compose mounts a proxy rule into this directory instead.
    include /etc/nginx/conf.d/locations/*.conf;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Fingerprinted build output can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /prizes/ {
        expires 7d;
    }

    # Client-side routes (/claim/..., /orders/...) all serve the SPA shell.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
