name: Deploy

# main -> CI -> build & push image -> dev (smoke + browser tested) -> production (needs approval).
# Setup: see docs/deploying.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Git SHA of an already-built image to (re)deploy. Empty builds the current commit."
        required: false

permissions:
  contents: read
  id-token: write # OIDC: GitHub proves its identity to AWS; no stored keys

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  ci:
    if: ${{ !inputs.image_tag }}
    uses: ./.github/workflows/ci.yml

  image:
    needs: ci
    # Deploy jobs stay skipped until the AWS bootstrap is done (docs/deploying.md).
    if: ${{ !inputs.image_tag && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/ticket2prize:${{ env.IMAGE_TAG }}
          cache-from: type=gha

  dev:
    needs: image
    if: ${{ !cancelled() && !failure() && vars.AWS_DEPLOY_ROLE_ARN != '' }}
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.apply.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - id: apply
        working-directory: infra/envs/dev
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve -var "image_tag=$IMAGE_TAG" \
            -var "alarm_email=${{ vars.ALARM_EMAIL }}"
          echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"
      - id: kiosk
        name: Fetch the kiosk key
        run: |
          key=$(aws secretsmanager get-secret-value --secret-id ticket2prize-dev/app \
            --query SecretString --output text | jq -r .kiosk_keys)
          echo "::add-mask::$key"
          echo "key=$key" >> "$GITHUB_OUTPUT"
      - run: scripts/smoke.sh "${{ steps.apply.outputs.url }}"
        env:
          KIOSK_KEY: ${{ steps.kiosk.outputs.key }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Browser tests against dev
        run: |
          npm ci && npx playwright install --with-deps chromium
          npx playwright test
        env:
          E2E_BASE_URL: ${{ steps.apply.outputs.url }}
          E2E_KIOSK_KEY: ${{ steps.kiosk.outputs.key }}

  production:
    needs: dev
    if: ${{ !cancelled() && !failure() && needs.dev.result == 'success' }}
    runs-on: ubuntu-latest
    # Add required reviewers to this environment in the repo settings to gate releases.
    environment:
      name: production
      url: ${{ steps.apply.outputs.url }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7
          terraform_wrapper: false
      - id: apply
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform apply -input=false -auto-approve -var "image_tag=$IMAGE_TAG" \
            -var "alarm_email=${{ vars.ALARM_EMAIL }}" \
            -var "certificate_arn=${{ vars.PROD_CERTIFICATE_ARN }}" \
            -var "public_base_url=${{ vars.PROD_PUBLIC_URL }}"
          echo "url=$(terraform output -raw url)" >> "$GITHUB_OUTPUT"
      - name: Smoke test (read-only)
        run: scripts/smoke.sh "${{ steps.apply.outputs.url }}"
