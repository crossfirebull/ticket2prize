name: CI

# Pushes to main run this via deploy.yml, so it isn't triggered twice.
on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  app:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ticket2prize
          POSTGRES_PASSWORD: ticket2prize
          POSTGRES_DB: ticket2prize
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ticket2prize"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgres://ticket2prize:ticket2prize@localhost:5432/ticket2prize
      TEST_DATABASE_URL: postgres://ticket2prize:ticket2prize@localhost:5432/ticket2prize_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - name: Migrations match the schema
        run: |
          npx drizzle-kit generate
          test -z "$(git status --porcelain drizzle)" || { git status drizzle; echo "Run npm run db:generate and commit the migration"; exit 1; }
      - name: Tests (Postgres, including race tests)
        run: npm test
      - run: npm run build

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.7
      - run: terraform fmt -check -recursive
      - name: Validate every root module
        run: |
          for dir in bootstrap envs/dev envs/prod; do
            terraform -chdir=$dir init -backend=false -input=false
            terraform -chdir=$dir validate
          done
      - name: Module tests (mocked AWS)
        working-directory: infra/modules/app
        run: |
          terraform init -backend=false -input=false
          terraform test

  # Build the production image, scan it, and drive it in a real browser.
  e2e:
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ticket2prize
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan the image for fixable critical CVEs
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ticket2prize
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Start the stack
        run: |
          docker compose up -d --no-build --wait
          docker compose exec -T app node cli.mjs create-staff staff@example.com ci-staff-password
      - run: scripts/smoke.sh http://localhost:3000
        env:
          KIOSK_KEY: dev-kiosk-key
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          E2E_BASE_URL: http://localhost:3000
          E2E_STAFF_EMAIL: staff@example.com
          E2E_STAFF_PASSWORD: ci-staff-password
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
      - name: Logs
        if: failure()
        run: docker compose logs
