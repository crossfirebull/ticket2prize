# Full stack on one machine: http://localhost:3000
name: ticket2prize

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ticket2prize
      POSTGRES_PASSWORD: ticket2prize
      POSTGRES_DB: ticket2prize
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket2prize"]
      interval: 3s
      retries: 20

  app:
    build: .
    image: ticket2prize
    environment:
      DATABASE_URL: postgres://ticket2prize:ticket2prize@db:5432/ticket2prize
      PUBLIC_BASE_URL: http://localhost:3000
      SEED_DEMO_DATA: "true"
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
