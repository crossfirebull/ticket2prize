[project]
name = "ticket2prize-api"
version = "1.0.0"
description = "Ticket2Prize redemption API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "pyjwt>=2.9",
    "pwdlib[argon2]>=0.2",
    "qrcode>=8.0",
    "prometheus-fastapi-instrumentator>=7.0",
]

[dependency-groups]
dev = ["pytest>=8", "httpx2>=2.0", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
